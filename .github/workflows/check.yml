name: Python checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without runtime dependencies
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Smoke-check replay CLI
        run: PYTHONPATH=src python -m autotrade8.app --summary > /dev/null
